<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spring AI 聊天测试</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f6f7f9;
    color: #1f2328;
  }
  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 760px;
    margin: 0 auto;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  header label { font-size: 13px; color: #6b7280; display: flex; align-items: center; gap: 5px; cursor: pointer; }
  header input { accent-color: #4f6ef2; }

  #messages { flex: 1; overflow-y: auto; padding: 20px; }
  .empty { text-align: center; color: #9ca3af; font-size: 14px; margin-top: 40px; }
  .row { display: flex; margin-bottom: 12px; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .row.user .bubble { background: #4f6ef2; color: #fff; border-bottom-right-radius: 4px; }
  .row.ai .bubble { background: #fff; border: 1px solid #e5e7eb; border-bottom-left-radius: 4px; }
  .bubble.error { color: #dc2626; border-color: #fecaca; }
  .bubble img.uploaded {
    display: block;
    max-width: 220px;
    max-height: 220px;
    border-radius: 10px;
    margin-bottom: 6px;
  }
  /* 流式输出中的光标 */
  .bubble.streaming::after {
    content: "▍";
    animation: blink 1s step-end infinite;
    color: #9ca3af;
  }
  @keyframes blink { 50% { opacity: 0; } }

  footer {
    display: flex;
    flex-direction: column;
    padding: 10px 20px 12px;
    background: #fff;
    border-top: 1px solid #e5e7eb;
  }
  #preview {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 0 8px;
    font-size: 13px;
    color: #6b7280;
  }
  #preview[hidden] { display: none; }
  #preview img {
    width: 44px;
    height: 44px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid #e5e7eb;
  }
  #previewName { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .input-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
  }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    padding: 9px 12px;
    font: inherit;
    font-size: 14.5px;
    line-height: 1.5;
    outline: none;
    max-height: 120px;
  }
  textarea:focus { border-color: #4f6ef2; }
  button {
    padding: 9px 18px;
    border: none;
    border-radius: 10px;
    background: #4f6ef2;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #3f5be0; }
  button.stop { background: #dc2626; }
  button#attach {
    background: #f3f4f6;
    color: #374151;
    padding: 9px 12px;
  }
  button#attach:hover { background: #e5e7eb; }
  button#removePreview {
    background: #f3f4f6;
    color: #6b7280;
    width: 24px;
    height: 24px;
    padding: 0;
    border-radius: 50%;
    line-height: 1;
    font-size: 15px;
  }
  button#removePreview:hover { background: #e5e7eb; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Spring AI 聊天测试</h1>
    <label><input type="checkbox" id="mode">非流式（/chat/ask）</label>
  </header>
  <main id="messages">
    <div class="empty">输入问题开始对话；点击 📎 或直接粘贴图片，走 /multimodal/stream 流式接口</div>
  </main>
  <footer>
    <div id="preview" hidden>
      <img id="previewImg" alt="图片预览">
      <span id="previewName"></span>
      <button id="removePreview" type="button" title="移除图片">×</button>
    </div>
    <div class="input-row">
      <input type="file" id="file" accept="image/*" hidden>
      <button id="attach" type="button" title="选择图片">📎</button>
      <textarea id="input" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行，可直接粘贴图片"></textarea>
      <button id="send">发送</button>
    </div>
  </footer>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const modeEl = document.getElementById('mode');
const fileEl = document.getElementById('file');
const attachEl = document.getElementById('attach');
const previewEl = document.getElementById('preview');
const previewImgEl = document.getElementById('previewImg');
const previewNameEl = document.getElementById('previewName');
const removePreviewEl = document.getElementById('removePreview');

let controller = null;   // 当前请求，用于"停止"
let busy = false;
let attachment = null;   // 待发送的图片 File
let attachmentUrl = null; // 预览/气泡共用的本地 objectURL

// 页面打开时生成的会话标识，关闭页面前所有请求都携带它作为 sessionId
const sessionId = crypto.randomUUID();

function sendOrStop() {
  if (busy) { controller?.abort(); return; }
  send();
}

async function send() {
  const qus = inputEl.value.trim();
  if (!qus && !attachment) return;

  inputEl.value = '';
  autoSize();
  const empty = messagesEl.querySelector('.empty');
  if (empty) empty.remove();

  // 用户气泡：图在上、文字在下（发送后不 revoke URL，气泡里还要显示）
  const userBubble = addRow('user', '', true);
  if (attachment) {
    const img = document.createElement('img');
    img.className = 'uploaded';
    img.src = attachmentUrl;
    img.alt = '发送的图片';
    userBubble.appendChild(img);
  }
  if (qus) userBubble.appendChild(document.createTextNode(qus));

  const file = attachment;
  resetAttachment(false);

  const target = addRow('ai', '');
  setBusy(true);
  controller = new AbortController();
  try {
    if (file) {
      await streamUpload(qus, file, controller.signal, target);
    } else if (modeEl.checked) {
      const res = await fetch('/chat/ask?qus=' + encodeURIComponent(qus)
              + '&sessionId=' + encodeURIComponent(sessionId), { signal: controller.signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      target.textContent = await res.text();
    } else {
      await streamChat(qus, controller.signal, target);
    }
  } catch (e) {
    if (e.name === 'AbortError') {
      target.textContent += '（已停止）';
    } else {
      target.classList.add('error');
      target.textContent = '请求失败：' + e.message;
    }
  } finally {
    target.classList.remove('streaming');
    setBusy(false);
  }
}

// fetch + ReadableStream 解析 SSE（data:<chunk>），逐块追加到气泡
async function streamChat(qus, signal, target) {
  await requestStream('/chat/stream?qus=' + encodeURIComponent(qus)
          + '&sessionId=' + encodeURIComponent(sessionId), { signal }, target);
}

// 图片走 multipart POST，响应同样是 SSE，解析逻辑与文本流共用
async function streamUpload(qus, file, signal, target) {
  const fd = new FormData();
  fd.append('qus', qus);
  fd.append('file', file);
  fd.append('sessionId', sessionId);
  await requestStream('/multimodal/stream', { method: 'POST', body: fd, signal }, target);
}

async function requestStream(url, options, target) {
  const res = await fetch(url, { ...options, headers: { 'Accept': 'text/event-stream' } });
  if (!res.ok) {
    let detail = '';
    try { detail = (await res.text()).slice(0, 200); } catch {}
    throw new Error('HTTP ' + res.status + (detail ? '：' + detail : ''));
  }
  target.classList.add('streaming');
  const reader = res.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let buf = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true }).replaceAll('\r\n', '\n');
    let i;
    while ((i = buf.indexOf('\n\n')) !== -1) {
      const text = parseData(buf.slice(0, i));
      buf = buf.slice(i + 2);
      if (text) {
        target.textContent += text;
        scrollBottom(false);
      }
    }
  }
}

// 一个 SSE event 里的 data: 行拼接；兼容带空格与 [DONE]
function parseData(event) {
  const lines = event.split('\n').filter(l => l.startsWith('data:'));
  if (!lines.length) return null;
  const s = lines.map(l => l[5] === ' ' ? l.slice(6) : l.slice(5)).join('\n');
  return s === '[DONE]' ? null : s;
}

function addRow(role, text, forceScroll) {
  const row = document.createElement('div');
  row.className = 'row ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollBottom(forceScroll);
  return bubble;
}

function scrollBottom(force) {
  const near = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80;
  if (force || near) messagesEl.scrollTop = messagesEl.scrollHeight;
}

function setBusy(on) {
  busy = on;
  controller = on ? controller : null;
  sendBtn.textContent = on ? '停止' : '发送';
  sendBtn.classList.toggle('stop', on);
}

function autoSize() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
}

// —— 图片附件：选择 / 粘贴 / 预览 ——
function setAttachment(file) {
  if (!file || !file.type.startsWith('image/')) return;
  attachment = file;
  if (attachmentUrl) URL.revokeObjectURL(attachmentUrl);
  attachmentUrl = URL.createObjectURL(file);
  previewImgEl.src = attachmentUrl;
  previewNameEl.textContent = file.name || '粘贴的图片';
  previewEl.hidden = false;
}

// revoke=false 时（发送后）URL 留给气泡显示；true 时（手动移除）立即释放
function resetAttachment(revoke) {
  if (revoke && attachmentUrl) URL.revokeObjectURL(attachmentUrl);
  attachment = null;
  attachmentUrl = null;
  previewEl.hidden = true;
  fileEl.value = '';
}

attachEl.addEventListener('click', () => fileEl.click());
fileEl.addEventListener('change', () => setAttachment(fileEl.files[0]));
removePreviewEl.addEventListener('click', () => resetAttachment(true));

inputEl.addEventListener('paste', e => {
  const item = Array.from(e.clipboardData?.items || [])
    .find(i => i.type.startsWith('image/'));
  if (item) {
    e.preventDefault();
    setAttachment(item.getAsFile());
  }
});

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendOrStop();
  }
});
inputEl.addEventListener('input', autoSize);
sendBtn.addEventListener('click', sendOrStop);
</script>
</body>
</html>
